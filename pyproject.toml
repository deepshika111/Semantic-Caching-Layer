[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "semantic-llm-cache"
version = "0.1.0"
description = "Provider-aware semantic caching proxy for LLM APIs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Semantic Cache" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "openai>=1.50.0",
    "httpx>=0.27.0",
    "redis>=5.2.0",
    "prometheus-client>=0.21.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "locust>=2.32.0",
]

[project.scripts]
semantic-cache = "semantic_cache.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/semantic_cache"]

[tool.hatch.build.targets.wheel.sources]
"src/semantic_cache" = "semantic_cache"

[tool.hatch.build.targets.sdist]
include = ["src/semantic_cache", "README.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.ruff.format]
quote-style = "double"
